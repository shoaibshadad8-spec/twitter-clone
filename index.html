
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter Clone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="twitter-container">
      <header class="header">
        <h2>الرئيسية</h2>
      </header>

      <div class="create-tweet">
        <textarea placeholder="ماذا يحدث؟"></textarea>
        <div class="actions">
          <button>تغريد</button>
        </div>
      </div>

      <div class="feed">
       
        <div class="tweet-card">
          <div class="user-info">
            <strong>User Name</strong>
            <span>@username</span>
          </div>
          <p>HTML CSS</p>
          <div class="tweet-stats">
            <span> 5</span>
            <span> 2</span>
            <span> 18</span>
          </div>
        </div>

    
        <div class="tweet-card">
          <div class="user-info">
            <strong>Developer</strong>
            <span>@Developer</span>
          </div>
          <p>صفحة التغريدات</p>
          <div class="tweet-stats">
            <span> 1</span>
            <span> 3</span>
            <span> 12</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

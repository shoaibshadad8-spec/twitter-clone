<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter Clone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="twitter-container">
      <header class="header">
        <h2>الرئيسية</h2>
        <span id="tweetsCount">0 تغريدة</span>
      </header>

      <div class="create-tweet">
        <div class="avatar">S</div>
        <div class="tweet-form">
          <textarea id="tweetInput" placeholder="ماذا يحدث؟" maxlength="280"></textarea>
          <div class="actions">
            <span id="counter">280</span>
            <button id="tweetBtn" disabled>تغريد</button>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-filter="all">الكل</button>
        <button class="tab" data-filter="liked">المعجب بها</button>
      </div>

      <div class="feed" id="feed"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
